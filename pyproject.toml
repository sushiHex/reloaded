[project]
name = "reloaded"
version = "0.1.0"
description = "A Windows Terminal launcher for Claude Code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "sushiHex" }]
dependencies = [
    "psutil",
    "uiautomation",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/sushiHex/reloaded"

[project.scripts]
reloaded = "reloaded.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
