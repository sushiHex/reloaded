# win32.py loads user32.dll via ctypes at *import* time, so this only runs on
# Windows — not a platform choice, a hard requirement (ctypes.WinDLL doesn't
# exist on other platforms at all). The suite itself needs no live desktop or
# real Windows Terminal: OS-facing calls are mocked at the unit level.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor the package promises, and what its scheduled tasks run
        # on the machine it was built for (`pyw -3`).
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -v
